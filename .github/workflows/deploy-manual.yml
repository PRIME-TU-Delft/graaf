name: Deploy Manual to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['manual/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install

      # root tsconfig.json extends .svelte-kit/tsconfig.json; without this,
      # the manual build's tsconfig resolution reaches into the repo root
      # and fails since that file is gitignored/generated.
      - name: Generate root .svelte-kit types
        run: pnpm exec svelte-kit sync

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          path: manual

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
